noteBlock:`<b>Lưu ý về dữ liệu (đọc trước khi kết luận)</b><ul>
<li><b>Tuần này site đổi hẳn mặt truy vấn.</b> Toàn bộ cụm <i>melbourne</i> về 0 impression, thay vào đó là các biến thể Sydney, Brisbane, Adelaide và cấp quốc gia. Đây là lý do vị trí trung bình nhảy từ 30,7 xuống 17,2 — các truy vấn nằm ở vị trí 50–99 biến mất chứ không phải thứ hạng cũ tự cải thiện.</li>
<li><b>Vì vậy đừng đọc vị trí 17,2 như một chiến thắng.</b> Impressions giảm 273 → 184 và clicks giảm 8 → 3 cùng lúc. Mẫu số đổi, không phải chất lượng đổi.</li>
<li><b>Direct tăng vọt 37 → 63 session với thời lượng 2 giây.</b> Mức tăng 70% đi kèm engagement gần như bằng 0 nên cần kiểm tra bot hoặc traffic nội bộ trước khi tính vào kết quả.</li>
<li><b>Ahrefs và trích dẫn AI lấy từ snapshot ngày 18/09</b> trong kho <code>dxliving-seo-report</code>. Lưu ý bản quét 19/09 ghi nhận backlink bùng nổ 392 → 607 theo kiểu spam — hiện tượng đó nằm NGOÀI tuần này.</li>
<li><b>GSC trễ 3 ngày</b>, cửa sổ tuần chạy 12–18/09.</li>
<li><b>Cộng tay bảng truy vấn sẽ ra 2 click chứ không phải 3.</b> GSC ẩn các truy vấn quá ít lượt để bảo vệ danh tính người tìm, nên tổng site luôn lớn hơn hoặc bằng tổng bảng. Dùng số 3 khi nói về tổng site.</li>
<li><b>stage.dxliving.com vẫn chưa được sửa</b> — <code>stage.dxliving.com/faq</code> và <code>/contact</code> còn hiển thị. Tuần thứ năm liên tiếp.</li></ul>`,

recs:[
["Cụm Melbourne về 0 impression — cần xác minh đây là mất hạng hay Google đang tái phân loại","Tuần trước còn 19 truy vấn melbourne với tổng khoảng 90 impressions, tuần này đúng 0. Cùng lúc trang /articles/3d-renders-for-real-estate-melbourne rơi 116 → 3. Kiểm tra ngay Page indexing trong GSC cho cụm trang Melbourne và chạy URL Inspection trên ba URL đại diện trước khi kết luận."],
["Đừng đọc vị trí 17,2 như một chiến thắng","Vị trí trung bình cải thiện 30,7 → 17,2 chỉ vì các truy vấn ở vị trí 50–99 biến mất khỏi mẫu. Impressions cùng lúc giảm 273 → 184 và clicks 8 → 3. Khi báo cáo lên cấp trên, luôn đặt ba số này cạnh nhau."],
["Direct tăng 70% với thời lượng 2 giây — nhiều khả năng không phải người thật","Direct nhảy 37 → 63 session, engagement rate 17,5%, trung bình 2 giây. Đây là toàn bộ phần tăng của tổng traffic tuần này. Bật filter Internal Traffic trong GA4 và kiểm tra báo cáo theo giờ để loại bot trước khi số này làm sai lệch mọi so sánh sau."],
["Sáu bài mới cấp quốc gia và theo thành phố đã có hiển thị — đúng hướng, cần tiếp sức","3d-rendering-for-architects-australia 21 impressions · digital-twin-construction-australia vị trí 4,3 · 3d-renders-for-property-developers-sydney vị trí 11,4. Lần đầu site có mặt ngoài Melbourne. Thêm internal link từ hub và trang chủ, và bổ sung FAQ schema cho từng bài."],
["architectural visualization australia đi từ 78 lên 35,2 — chọn một cách viết và dồn lực","Biến thể kiểu Mỹ tăng 1 → 5 impressions và cải thiện 43 bậc, trong khi biến thể Anh về 0. Hai trang đang tự cạnh tranh nhau. Chọn một URL chính, canonical trang còn lại về đó, và nhắm đúng cụm trong title."],
["Hiện diện AI yếu đi theo hai nguồn đo độc lập","Trích dẫn ChatGPT 12 → 9 (Ahrefs) và session từ AI 3 → 0 (GA4). Hai hệ đo khác nhau cùng chỉ một hướng nên đây là tín hiệu thật. Bổ sung FAQ + schema FAQPage cho cụm bài BIM và configurator, đó là dạng nội dung AI hay trích."],
["GA4 vẫn 0 key event — tuần thứ ba liên tiếp","133 session, 0 chuyển đổi đo được. Tracking trang đã chạy đúng nên chỉ còn thiếu cấu hình key event. Đây là việc một buổi chiều, và không có nó thì không báo cáo được giá trị của SEO."],
["stage.dxliving.com — tuần thứ năm","stage.dxliving.com/faq và /contact vẫn có hiển thị. Cách dứt điểm là HTTP auth cho subdomain stage, vì robots.txt Disallow: / đang ngăn Google đọc chính thẻ noindex."]
]},

noteBlock:`<b>Data caveats (read before drawing conclusions)</b><ul>
<li><b>The site's query face changed completely this week.</b> The entire <i>melbourne</i> cluster went to zero impressions, replaced by Sydney, Brisbane, Adelaide and national variants. That is why average position jumped from 30.7 to 17.2 — queries sitting at positions 50–99 disappeared rather than the old rankings improving.</li>
<li><b>So do not read 17.2 as a win.</b> Impressions fell 273 to 184 and clicks 8 to 3 at the same time. The denominator changed, not the quality.</li>
<li><b>Direct traffic jumped 37 to 63 sessions at 2 seconds each.</b> A 70% rise with near-zero engagement needs checking for bots or internal traffic before it counts as a result.</li>
<li><b>Ahrefs and AI citations come from the 18 Sep snapshot</b> in the <code>dxliving-seo-report</code> repository. Note that the 19 Sep scan recorded a spam-shaped backlink jump, 392 to 607 — that event falls OUTSIDE this week.</li>
<li><b>GSC lags 3 days</b>, so the window runs 12–18 Sep.</li>
<li><b>Adding up the query table gives 2 clicks, not 3.</b> GSC withholds queries with too few hits to protect searcher privacy, so the site total is always greater than or equal to the table total. Use 3 for site-level figures.</li>
<li><b>stage.dxliving.com is still unfixed</b> — <code>stage.dxliving.com/faq</code> and <code>/contact</code> still draw impressions. A fifth consecutive week.</li></ul>`,

recs:[
["The Melbourne cluster went to zero impressions — verify whether this is lost ranking or reclassification","Last week carried 19 melbourne queries worth roughly 90 impressions; this week it is exactly zero. At the same time /articles/3d-renders-for-real-estate-melbourne fell 116 to 3. Check Page indexing in GSC for the Melbourne page cluster and run URL Inspection on three representative URLs before concluding anything."],
["Do not read position 17.2 as a win","Average position improved 30.7 to 17.2 only because the queries sitting at positions 50–99 left the sample. Impressions fell 273 to 184 and clicks 8 to 3 over the same period. When reporting upward, always put those three numbers side by side."],
["Direct rose 70% at 2 seconds a session — most likely not human","Direct jumped 37 to 63 sessions with a 17.5% engagement rate and a 2-second average. That is the whole of this week's traffic growth. Switch on the Internal Traffic filter in GA4 and check the hourly report to rule out bots before this figure distorts every later comparison."],
["Six new national and city articles are drawing impressions — the right direction, now reinforce it","3d-rendering-for-architects-australia at 21 impressions · digital-twin-construction-australia at position 4.3 · 3d-renders-for-property-developers-sydney at 11.4. This is the first time the site has appeared outside Melbourne. Add internal links from the hub and homepage, and FAQ schema to each article."],
["architectural visualization australia moved from 78 to 35.2 — pick one spelling and commit","The US variant rose 1 to 5 impressions and gained 43 places while the British variant fell to zero. Two pages are competing with each other. Choose one canonical URL, point the other at it, and target the exact phrase in the title."],
["AI presence is weakening on two independent measurements","ChatGPT citations 12 to 9 (Ahrefs) and AI sessions 3 to 0 (GA4). Two different systems pointing the same way makes this a real signal. Add FAQ blocks and FAQPage schema to the BIM and configurator articles, which are the shape of content AI engines cite."],
["GA4 still shows zero key events — a third consecutive week","133 sessions and no measurable conversion. Page tracking works correctly now, so only the key-event configuration is missing. It is an afternoon of work, and without it the value of SEO cannot be reported at all."],
["stage.dxliving.com — week five","stage.dxliving.com/faq and /contact still draw impressions. HTTP auth on the staging subdomain is the way to close it, because robots.txt Disallow: / is what stops Google reading the noindex in the first place."]
]}};

let LANG='vi';
const T=k=>I18N[LANG][k];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nf=n=>LANG==='vi'?n.toLocaleString('vi-VN'):n.toLocaleString('en-US');
const dec=(n,d=1)=>LANG==='vi'?n.toFixed(d).replace('.',','):n.toFixed(d);
function pct(cur,prev){if(!prev)return null;return (cur-prev)/prev*100;}

function kpiCard(label,value,prev,opt={}){
  let chg='',cls='neutralc';
  if(opt.invert&&prev!=null){
    const d=value-prev;
    cls=d<0?'positive':d>0?'negative':'neutralc';
    chg=(d>0?'+':d<0?'−':'')+dec(Math.abs(d))+T('posUnit');
  } else if(opt.pp&&prev!=null){
    const d=value-prev;
    cls=d>0?'positive':d<0?'negative':'neutralc';
    chg=(d>0?'+':d<0?'−':'')+dec(Math.abs(d))+T('ppUnit');
  } else if(!opt.raw&&prev!=null){
    const p=pct(value,prev);
    cls=p>0?'positive':p<0?'negative':'neutralc';
    chg=(p>0?'+':p<0?'−':'')+dec(Math.abs(p))+'%';
  } else { chg=opt.note||''; }
  const disp=opt.suffix!=null?dec(value)+opt.suffix:nf(value);
  const prevTxt=prev!=null?(T('prevLabel')+' '+(opt.suffix!=null?dec(prev)+opt.suffix:nf(prev))):(opt.prevNote||'');
  return `<div class="kpi"><div class="lbl">${esc(label)}</div><div class="val">${disp}</div>
  <div class="chg ${cls}">${chg}</div><div class="prev">${esc(prevTxt)}</div></div>`;
}

/* ==================== CHARTS (SVG thuần / pure SVG) ==================== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  const s=n<=1?1:n<=1.5?1.5:n<=2?2:n<=3?3:n<=4?4:n<=5?5:n<=7.5?7.5:10;return s*p;}
function legend(items){return '<div class="legend">'+items.map(i=>
  `<span><i style="background:${i.c}"></i>${esc(i.t)}</span>`).join('')+'</div>';}

function comboChart(el,rows){
  const W=760,H=300,mL=44,mR=46,mT=14,mB=52;
  const iw=W-mL-mR, ih=H-mT-mB;
  const maxI=niceMax(Math.max(...rows.map(r=>r[2])));
  const maxC=niceMax(Math.max(...rows.map(r=>r[1])));
  const bw=iw/rows.length, bar=bw*0.62;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('c1t'))}">`;
  for(let i=0;i<=4;i++){const y=mT+ih-ih*i/4;
    s+=`<line class="grid" x1="${mL}" y1="${y}" x2="${mL+iw}" y2="${y}"/>`;
    s+=`<text class="axis" x="${mL-7}" y="${y+3.5}" text-anchor="end">${Math.round(maxC*i/4)}</text>`;
    s+=`<text class="axis" x="${mL+iw+7}" y="${y+3.5}">${Math.round(maxI*i/4)}</text>`;}
  rows.forEach((r,i)=>{const h=ih*r[2]/maxI;const x=mL+i*bw+(bw-bar)/2;
    s+=`<rect x="${x.toFixed(1)}" y="${(mT+ih-h).toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="#4C72B0" opacity=".28" rx="2"><title>${esc(r[0])}: ${r[2]} ${esc(T('kImpr').toLowerCase())}</title></rect>`;});
  const pts=rows.map((r,i)=>[mL+i*bw+bw/2, mT+ih-ih*r[1]/maxC]);
  s+=`<polyline fill="none" stroke="#DD8452" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="#DD8452"><title>${esc(rows[i][0])}: ${rows[i][1]} ${esc(T('kClicks').toLowerCase())}</title></circle>`;});
  rows.forEach((r,i)=>{if(i%2)return;const x=mL+i*bw+bw/2;
    s+=`<text class="axis" transform="translate(${x.toFixed(1)},${mT+ih+13}) rotate(-45)" text-anchor="end">${esc(r[0])}</text>`;});
  s+=`<text class="axlab" x="${mL}" y="${mT-3}" text-anchor="middle">${esc(T('axClicks'))}</text>`;
  s+=`<text class="axlab" x="${mL+iw}" y="${mT-3}" text-anchor="middle">${esc(T('axImpr'))}</text>`;
  s+='</svg>';
  el.innerHTML=legend([{c:'#4C72B0',t:T('lgImpr')},{c:'#DD8452',t:T('lgClicks')}])+s;
}

function barChart(el,rows,color){
  const W=560,H=280,mL=40,mR=12,mT=22,mB=34;
  const iw=W-mL-mR, ih=H-mT-mB;
  const max=niceMax(Math.max(...rows.map(r=>r[1])));
  const bw=iw/rows.length, bar=Math.min(bw*0.6,54);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('c2t'))}">`;
  for(let i=0;i<=4;i++){const y=mT+ih-ih*i/4;
    s+=`<line class="grid" x1="${mL}" y1="${y}" x2="${mL+iw}" y2="${y}"/>`;
    s+=`<text class="axis" x="${mL-7}" y="${y+3.5}" text-anchor="end">${Math.round(max*i/4)}</text>`;}
  rows.forEach((r,i)=>{const h=ih*r[1]/max;const x=mL+i*bw+(bw-bar)/2;const y=mT+ih-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="${color}" rx="3"><title>${esc(r[0])}: ${r[1]}</title></rect>`;
    s+=`<text class="dlbl" x="${(x+bar/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${r[1]}</text>`;
    s+=`<text class="axis" x="${(mL+i*bw+bw/2).toFixed(1)}" y="${mT+ih+15}" text-anchor="middle">${esc(r[0])}</text>`;});
  s+='</svg>';el.innerHTML=s;
}

function donutChart(el,rows){
  const S=250,cx=125,cy=125,rO=100,rI=60;
  const total=rows.reduce((a,r)=>a+r[1],0);
  let a0=-Math.PI/2,s=`<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(T('c3t'))}">`;
  rows.forEach((r,i)=>{
    const ang=r[1]/total*Math.PI*2, a1=a0+ang, big=ang>Math.PI?1:0;
    const p=(rr,a)=>[(cx+rr*Math.cos(a)).toFixed(2),(cy+rr*Math.sin(a)).toFixed(2)];
    const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
    s+=`<path d="M${x0},${y0} A${rO},${rO} 0 ${big},1 ${x1},${y1} L${x2},${y2} A${rI},${rI} 0 ${big},0 ${x3},${y3} Z" fill="${COLORS[i%COLORS.length]}" stroke="#fff" stroke-width="2"><title>${esc(r[0])}: ${r[1]} (${dec(r[1]/total*100)}%)</title></path>`;
    if(r[1]/total>0.05){const [lx,ly]=p((rO+rI)/2,a0+ang/2);
      s+=`<text x="${lx}" y="${+ly+4}" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">${r[1]}</text>`;}
    a0=a1;});
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1b1c20">${total}</text>`;
  s+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" style="font-size:11px;fill:#6b7280">${esc(T('sessionsWord'))}</text></svg>`;
  el.innerHTML=legend(rows.map((r,i)=>({c:COLORS[i%COLORS.length],t:`${r[0]} — ${r[1]} (${dec(r[1]/total*100)}%)`})))+
    `<div style="max-width:280px;margin:0 auto">${s}</div>`;
}

function groupedBarChart(el,rows){
  const n=rows.length,rowH=30,mT=10,mB=26,mL=232,mR=44,W=760;
  const H=mT+mB+n*rowH, iw=W-mL-mR;
  const max=niceMax(Math.max(...rows.map(r=>Math.max(r[1],r[2]))));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('c4t'))}">`;
  for(let i=0;i<=4;i++){const x=mL+iw*i/4;
    s+=`<line class="grid" x1="${x}" y1="${mT}" x2="${x}" y2="${mT+n*rowH}"/>`;
    s+=`<text class="axis" x="${x}" y="${mT+n*rowH+15}" text-anchor="middle">${Math.round(max*i/4)}</text>`;}
  rows.forEach((r,i)=>{
    const y=mT+i*rowH, h=9;
    const w1=iw*r[1]/max, w2=iw*r[2]/max;
    s+=`<text class="axis" x="${mL-8}" y="${y+rowH/2+3}" text-anchor="end" style="font-size:10px;fill:#374151">${esc(r[0].length>36?r[0].slice(0,34)+'…':r[0])}</text>`;
    s+=`<rect x="${mL}" y="${y+4}" width="${Math.max(w1,0).toFixed(1)}" height="${h}" fill="#4C72B0" rx="2"><title>${esc(T('lgThis'))}: ${r[1]}</title></rect>`;
    s+=`<rect x="${mL}" y="${y+15}" width="${Math.max(w2,0).toFixed(1)}" height="${h}" fill="#c3cad6" rx="2"><title>${esc(T('lgPrev'))}: ${r[2]}</title></rect>`;
    s+=`<text class="dlbl" x="${(mL+Math.max(w1,w2)+6).toFixed(1)}" y="${y+rowH/2+3.5}">${r[1]} / ${r[2]}</text>`;});
  s+='</svg>';
  el.innerHTML=legend([{c:'#4C72B0',t:T('lgThis')},{c:'#c3cad6',t:T('lgPrev')}])+s;
}

/* ==================== TABLES ==================== */
function arrowPos(cur,prev){
  if(cur==null||prev==null)return '<span class="neutralc">—</span>';
  const d=cur-prev;
  if(Math.abs(d)<0.05)return '<span class="neutralc">→ '+dec(0)+'</span>';
  return d<0?`<span class="positive">▲ ${dec(Math.abs(d))}</span>`:`<span class="negative">▼ ${dec(d)}</span>`;
}
function arrowNum(cur,prev){
  const d=cur-prev;
  if(d===0)return '<span class="neutralc">0</span>';
  return d>0?`<span class="positive">+${d}</span>`:`<span class="negative">${d}</span>`;
}
function buildTable(el,cols,rows,sortIdx){
  let dir=-1,idx=sortIdx;
  function draw(){
    const sorted=[...rows].sort((a,b)=>{
      const x=a.sort[idx],y=b.sort[idx];
      if(x==null)return 1; if(y==null)return -1;
      return x<y?dir:x>y?-dir:0;
    });
    el.innerHTML='<thead><tr>'+cols.map((c,i)=>
      `<th class="${c.num?'num':''}" data-i="${i}">${esc(c.label)}${i===idx?(dir===-1?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>'+
      sorted.map(r=>'<tr>'+r.cells.map((c,i)=>`<td class="${cols[i].num?'num':''}">${c}</td>`).join('')+'</tr>').join('')+'</tbody>';
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i; if(i===idx)dir=-dir; else{idx=i;dir=-1;} draw();
    });
  }
  draw();
}

let currentFilter='all';

function renderTables(){
  // Tracked
  buildTable(document.getElementById('tblTracked'),
   [{label:T('thTracked')},{label:T('thStatus')},{label:T('thPos7'),num:true},{label:T('thPosDelta'),num:true},{label:T('thImpr'),num:true},{label:T('thClicks'),num:true}],
   TRACKED.map(t=>({
     sort:[t[0],t[1],t[4]==null?999:t[4],t[4]==null?0:(t[4]-t[5]),t[3],t[2]],
     cells:[esc(t[0]),
       t[1]==='branded'?`<span class="tag brand">${T('tagBrand')}</span>`:t[1]==='lost'?`<span class="tag risk">${T('tagNew')}</span>`:`<span class="tag none">${T('tagNone')}</span>`,
       t[4]==null?'—':dec(t[4]),
       arrowPos(t[4],t[5]),
       nf(t[3]),nf(t[2])]
   })),4);

  // Queries
  const qRows=QUERIES.map(q=>{
    const brand=/dxliving|dx living/i.test(q[0]);
    const lost=q[3]===0&&q[4]>0;
    const op=!brand&&q[3]>0&&q[5]!=null&&q[5]>=5&&q[5]<=20;
    const up=q[3]>q[4], down=q[3]<q[4]&&q[3]>0;
    let tags=[];
    if(brand)tags.push(`<span class="tag brand">${T('tagBrand')}</span>`);
    if(op)tags.push(`<span class="tag op">${T('tagOp')}</span>`);
    if(lost)tags.push(`<span class="tag risk">${T('tagLost')}</span>`);
    else if(up)tags.push(`<span class="tag win">${T('tagUp')}</span>`);
    return {f:{all:1,op:op?1:0,up:up?1:0,down:down?1:0,lost:lost?1:0},
      sort:[q[0],q[3],q[3]-q[4],q[5]==null?999:q[5],q[1],0],
      cells:[esc(q[0])+' '+tags.join(' '),nf(q[3]),arrowNum(q[3],q[4]),
        q[5]==null?'—':dec(q[5]),arrowPos(q[5],q[6]),nf(q[1])]};
  });
  const qCols=[{label:T('thQuery')},{label:T('thImpr'),num:true},{label:T('thImprDelta'),num:true},{label:T('thPos'),num:true},{label:T('thPosD'),num:true},{label:T('thClicks'),num:true}];
  buildTable(document.getElementById('tblQueries'),qCols,qRows.filter(r=>r.f[currentFilter]),1);

  // Pages
  buildTable(document.getElementById('tblPages'),
   [{label:T('thPage')},{label:T('thImpr'),num:true},{label:T('thImprD'),num:true},{label:T('thClicks'),num:true},{label:T('thCtr'),num:true},{label:T('thPos'),num:true},{label:T('thPosD'),num:true}],
   PAGES.map(p=>({
     sort:[p[0],p[3],p[3]-p[4],p[1],p[3]?p[1]/p[3]:0,p[5]==null?999:p[5],0],
     cells:[(/^stage\./.test(p[0])?`<span class="tag risk">${T('tagStage')}</span> `:'')+esc(p[0])+(p[7]?T(p[7]):''),
       nf(p[3]),arrowNum(p[3],p[4]),nf(p[1]),
       dec(p[3]?p[1]/p[3]*100:0)+'%',
       p[5]==null?'—':dec(p[5]),arrowPos(p[5],p[6])]
   })),1);

  // Source / medium
  buildTable(document.getElementById('tblSrc'),
   [{label:T('thSource')},{label:T('thSessions'),num:true},{label:T('thPctTotal'),num:true},{label:T('thChannel')}],
   SRC.map(s=>({sort:[s[0],s[1],s[1],s[3]],
     cells:[(/ai-assistant/.test(s[0])?'<span class="tag op">AI</span> ':'')+esc(s[0]),nf(s[1]),dec(s[2],2)+'%',esc(s[3])]})),1);
}

/* ==================== WEEK PICKER ====================
   Cùng bất biến với báo cáo ngày: bộ chọn ĐIỀU HƯỚNG, không tính lại số.
   Same invariant as the daily report: the picker NAVIGATES, it never recomputes. */
const THIS_WEEK='2026-09-18';                       // id tuần = ngày kết thúc / week id = end date
let WEEKS=[{id:'2026-09-18',vi:'12–18/09/2026',en:'12–18 Sep 2026'},{id:'2026-09-11',vi:'05–11/09/2026',en:'5–11 Sep 2026'},{id:'2026-09-04',vi:'29/08–04/09/2026',en:'29 Aug – 4 Sep 2026'},{id:'2026-08-28',vi:'22–28/08/2026',en:'22–28 Aug 2026'},{id:'2026-08-22',vi:'16–22/08/2026',en:'16–22 Aug 2026'}];  // fallback khi fetch lỗi

function gotoWeek(id){
  if(!id||id===THIS_WEEK)return;
  location.href=id+'.html';
}
function renderPicker(){
  const sel=document.getElementById('weekSel'),meta=document.getElementById('weekMeta');
  if(!sel)return;
  sel.innerHTML=WEEKS.map(w=>
    `<option value="${w.id}"${w.id===THIS_WEEK?' selected':''}>${LANG==='vi'?w.vi:w.en}</option>`).join('');
  const n=WEEKS.length;
  meta.textContent=`${n} ${n===1?T('weekOnly'):T('weeksStored')} · ${T('latestWord')}: `+
    (LANG==='vi'?WEEKS[0].vi:WEEKS[0].en)+' — '+T('pickNote');
}
(async()=>{
  try{
    const r=await fetch('index.json',{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if(Array.isArray(j.weeks)&&j.weeks.length){
      WEEKS=j.weeks.slice().sort((a,b)=>b.id.localeCompare(a.id));
      renderPicker();
    }
  }catch(e){/* mở từ ổ đĩa hoặc chưa có manifest — giữ fallback */}
})();

/* ==================== LANGUAGE ==================== */
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.title=T('docTitle');
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=T(e.dataset.t);});
  document.querySelectorAll('[data-html]').forEach(e=>{e.innerHTML=T(e.dataset.html);});
  document.getElementById('btn-vi').classList.toggle('active',l==='vi');
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.body.classList.toggle('lang-vi',l==='vi');
  document.body.classList.toggle('lang-en',l==='en');
  try{localStorage.setItem('dxl-report-lang',l);}catch(e){}
  renderKPIs();renderCharts();renderTables();renderRecs();renderPicker();renderAI();
}

document.querySelectorAll('#qTabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#qTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentFilter=b.dataset.f;renderTables();
});

let saved='vi';
try{saved=localStorage.getItem('dxl-report-lang')||'vi';}catch(e){}
setLang(saved==='en'?'en':'vi');
