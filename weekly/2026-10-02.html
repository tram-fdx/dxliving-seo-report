/* ==================== HELPERS ==================== */
let LANG='vi';
const T=k=>I18N[LANG][k];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nf=n=>LANG==='vi'?n.toLocaleString('vi-VN'):n.toLocaleString('en-US');
const dec=(n,d=1)=>LANG==='vi'?n.toFixed(d).replace('.',','):n.toFixed(d);
function pct(cur,prev){if(!prev)return null;return (cur-prev)/prev*100;}

function kpiCard(label,value,prev,opt={}){
  let chg='',cls='neutralc';
  if(opt.invert&&prev!=null){
    const d=value-prev;
    cls=d<0?'positive':d>0?'negative':'neutralc';
    chg=(d>0?'+':d<0?'−':'')+dec(Math.abs(d))+T('posUnit');
  } else if(opt.pp&&prev!=null){
    const d=value-prev;
    cls=d>0?'positive':d<0?'negative':'neutralc';
    chg=(d>0?'+':d<0?'−':'')+dec(Math.abs(d))+T('ppUnit');
  } else if(!opt.raw&&prev!=null){
    const p=pct(value,prev);
    cls=p>0?'positive':p<0?'negative':'neutralc';
    chg=(p>0?'+':p<0?'−':'')+dec(Math.abs(p))+'%';
  } else { chg=opt.note||''; }
  const disp=opt.suffix!=null?dec(value)+opt.suffix:nf(value);
  const prevTxt=prev!=null?(T('prevLabel')+' '+(opt.suffix!=null?dec(prev)+opt.suffix:nf(prev))):(opt.prevNote||'');
  return `<div class="kpi"><div class="lbl">${esc(label)}</div><div class="val">${disp}</div>
  <div class="chg ${cls}">${chg}</div><div class="prev">${esc(prevTxt)}</div></div>`;
}

/* ==================== CHARTS (SVG thuần / pure SVG) ==================== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  const s=n<=1?1:n<=1.5?1.5:n<=2?2:n<=3?3:n<=4?4:n<=5?5:n<=7.5?7.5:10;return s*p;}
function legend(items){return '<div class="legend">'+items.map(i=>
  `<span><i style="background:${i.c}"></i>${esc(i.t)}</span>`).join('')+'</div>';}

function comboChart(el,rows){
  const W=760,H=300,mL=44,mR=46,mT=14,mB=52;
  const iw=W-mL-mR, ih=H-mT-mB;
  const maxI=niceMax(Math.max(...rows.map(r=>r[2])));
  const maxC=niceMax(Math.max(...rows.map(r=>r[1])));
  const bw=iw/rows.length, bar=bw*0.62;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('c1t'))}">`;
  for(let i=0;i<=4;i++){const y=mT+ih-ih*i/4;
    s+=`<line class="grid" x1="${mL}" y1="${y}" x2="${mL+iw}" y2="${y}"/>`;
    s+=`<text class="axis" x="${mL-7}" y="${y+3.5}" text-anchor="end">${Math.round(maxC*i/4)}</text>`;
    s+=`<text class="axis" x="${mL+iw+7}" y="${y+3.5}">${Math.round(maxI*i/4)}</text>`;}
  rows.forEach((r,i)=>{const h=ih*r[2]/maxI;const x=mL+i*bw+(bw-bar)/2;
    s+=`<rect x="${x.toFixed(1)}" y="${(mT+ih-h).toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="#4C72B0" opacity=".28" rx="2"><title>${esc(r[0])}: ${r[2]} ${esc(T('kImpr').toLowerCase())}</title></rect>`;});
  const pts=rows.map((r,i)=>[mL+i*bw+bw/2, mT+ih-ih*r[1]/maxC]);
  s+=`<polyline fill="none" stroke="#DD8452" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="#DD8452"><title>${esc(rows[i][0])}: ${rows[i][1]} ${esc(T('kClicks').toLowerCase())}</title></circle>`;});
  rows.forEach((r,i)=>{if(i%2)return;const x=mL+i*bw+bw/2;
    s+=`<text class="axis" transform="translate(${x.toFixed(1)},${mT+ih+13}) rotate(-45)" text-anchor="end">${esc(r[0])}</text>`;});
  s+=`<text class="axlab" x="${mL}" y="${mT-3}" text-anchor="middle">${esc(T('axClicks'))}</text>`;
  s+=`<text class="axlab" x="${mL+iw}" y="${mT-3}" text-anchor="middle">${esc(T('axImpr'))}</text>`;
  s+='</svg>';
  el.innerHTML=legend([{c:'#4C72B0',t:T('lgImpr')},{c:'#DD8452',t:T('lgClicks')}])+s;
}

function barChart(el,rows,color){
  const W=560,H=280,mL=40,mR=12,mT=22,mB=34;
  const iw=W-mL-mR, ih=H-mT-mB;
  const max=niceMax(Math.max(...rows.map(r=>r[1])));
  const bw=iw/rows.length, bar=Math.min(bw*0.6,54);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('c2t'))}">`;
  for(let i=0;i<=4;i++){const y=mT+ih-ih*i/4;
    s+=`<line class="grid" x1="${mL}" y1="${y}" x2="${mL+iw}" y2="${y}"/>`;
    s+=`<text class="axis" x="${mL-7}" y="${y+3.5}" text-anchor="end">${Math.round(max*i/4)}</text>`;}
  rows.forEach((r,i)=>{const h=ih*r[1]/max;const x=mL+i*bw+(bw-bar)/2;const y=mT+ih-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="${color}" rx="3"><title>${esc(r[0])}: ${r[1]}</title></rect>`;
    s+=`<text class="dlbl" x="${(x+bar/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${r[1]}</text>`;
    s+=`<text class="axis" x="${(mL+i*bw+bw/2).toFixed(1)}" y="${mT+ih+15}" text-anchor="middle">${esc(r[0])}</text>`;});
  s+='</svg>';el.innerHTML=s;
}

function donutChart(el,rows){
  const S=250,cx=125,cy=125,rO=100,rI=60;
  const total=rows.reduce((a,r)=>a+r[1],0);
  let a0=-Math.PI/2,s=`<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(T('c3t'))}">`;
  rows.forEach((r,i)=>{
    const ang=r[1]/total*Math.PI*2, a1=a0+ang, big=ang>Math.PI?1:0;
    const p=(rr,a)=>[(cx+rr*Math.cos(a)).toFixed(2),(cy+rr*Math.sin(a)).toFixed(2)];
    const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
    s+=`<path d="M${x0},${y0} A${rO},${rO} 0 ${big},1 ${x1},${y1} L${x2},${y2} A${rI},${rI} 0 ${big},0 ${x3},${y3} Z" fill="${COLORS[i%COLORS.length]}" stroke="#fff" stroke-width="2"><title>${esc(r[0])}: ${r[1]} (${dec(r[1]/total*100)}%)</title></path>`;
    if(r[1]/total>0.05){const [lx,ly]=p((rO+rI)/2,a0+ang/2);
      s+=`<text x="${lx}" y="${+ly+4}" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">${r[1]}</text>`;}
    a0=a1;});
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1b1c20">${total}</text>`;
  s+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" style="font-size:11px;fill:#6b7280">${esc(T('sessionsWord'))}</text></svg>`;
  el.innerHTML=legend(rows.map((r,i)=>({c:COLORS[i%COLORS.length],t:`${r[0]} — ${r[1]} (${dec(r[1]/total*100)}%)`})))+
    `<div style="max-width:280px;margin:0 auto">${s}</div>`;
}

function groupedBarChart(el,rows){
  const n=rows.length,rowH=30,mT=10,mB=26,mL=232,mR=44,W=760;
  const H=mT+mB+n*rowH, iw=W-mL-mR;
  const max=niceMax(Math.max(...rows.map(r=>Math.max(r[1],r[2]))));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('c4t'))}">`;
  for(let i=0;i<=4;i++){const x=mL+iw*i/4;
    s+=`<line class="grid" x1="${x}" y1="${mT}" x2="${x}" y2="${mT+n*rowH}"/>`;
    s+=`<text class="axis" x="${x}" y="${mT+n*rowH+15}" text-anchor="middle">${Math.round(max*i/4)}</text>`;}
  rows.forEach((r,i)=>{
    const y=mT+i*rowH, h=9;
    const w1=iw*r[1]/max, w2=iw*r[2]/max;
    s+=`<text class="axis" x="${mL-8}" y="${y+rowH/2+3}" text-anchor="end" style="font-size:10px;fill:#374151">${esc(r[0].length>36?r[0].slice(0,34)+'…':r[0])}</text>`;
    s+=`<rect x="${mL}" y="${y+4}" width="${Math.max(w1,0).toFixed(1)}" height="${h}" fill="#4C72B0" rx="2"><title>${esc(T('lgThis'))}: ${r[1]}</title></rect>`;
    s+=`<rect x="${mL}" y="${y+15}" width="${Math.max(w2,0).toFixed(1)}" height="${h}" fill="#c3cad6" rx="2"><title>${esc(T('lgPrev'))}: ${r[2]}</title></rect>`;
    s+=`<text class="dlbl" x="${(mL+Math.max(w1,w2)+6).toFixed(1)}" y="${y+rowH/2+3.5}">${r[1]} / ${r[2]}</text>`;});
  s+='</svg>';
  el.innerHTML=legend([{c:'#4C72B0',t:T('lgThis')},{c:'#c3cad6',t:T('lgPrev')}])+s;
}

/* ==================== TABLES ==================== */
function arrowPos(cur,prev){
  if(cur==null||prev==null)return '<span class="neutralc">—</span>';
  const d=cur-prev;
  if(Math.abs(d)<0.05)return '<span class="neutralc">→ '+dec(0)+'</span>';
  return d<0?`<span class="positive">▲ ${dec(Math.abs(d))}</span>`:`<span class="negative">▼ ${dec(d)}</span>`;
}
function arrowNum(cur,prev){
  const d=cur-prev;
  if(d===0)return '<span class="neutralc">0</span>';
  return d>0?`<span class="positive">+${d}</span>`:`<span class="negative">${d}</span>`;
}
function buildTable(el,cols,rows,sortIdx){
  let dir=-1,idx=sortIdx;
  function draw(){
    const sorted=[...rows].sort((a,b)=>{
      const x=a.sort[idx],y=b.sort[idx];
      if(x==null)return 1; if(y==null)return -1;
      return x<y?dir:x>y?-dir:0;
    });
    el.innerHTML='<thead><tr>'+cols.map((c,i)=>
      `<th class="${c.num?'num':''}" data-i="${i}">${esc(c.label)}${i===idx?(dir===-1?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>'+
      sorted.map(r=>'<tr>'+r.cells.map((c,i)=>`<td class="${cols[i].num?'num':''}">${c}</td>`).join('')+'</tr>').join('')+'</tbody>';
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i; if(i===idx)dir=-dir; else{idx=i;dir=-1;} draw();
    });
  }
  draw();
}

  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=T(e.dataset.t);});
  document.querySelectorAll('[data-html]').forEach(e=>{e.innerHTML=T(e.dataset.html);});
  document.getElementById('btn-vi').classList.toggle('active',l==='vi');
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.body.classList.toggle('lang-vi',l==='vi');
  document.body.classList.toggle('lang-en',l==='en');
  try{localStorage.setItem('dxl-report-lang',l);}catch(e){}
  renderKPIs();renderCharts();renderTables();renderRecs();renderPicker();renderAI();
}

document.querySelectorAll('#qTabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#qTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentFilter=b.dataset.f;renderTables();
});

let saved='vi';
try{saved=localStorage.getItem('dxl-report-lang')||'vi';}catch(e){}
setLang(saved==='en'?'en':'vi');
</script>
</body>
</html>
