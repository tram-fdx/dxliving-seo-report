<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="https://tram-fdx.github.io/dxl-social-dashboard-site/fdx-favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Daily view</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--line:#e6e1d6;--ink:#22262c;--muted:#7b828c;--accent:#c9a46a;--green:#2f855a;--red:#c53030}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#2c2a26;color:#e5dcc7;padding:18px 0;border-bottom:4px solid var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:20px}
  .sub{font-size:12px;opacity:.8;margin-top:4px}
  header a{color:#e5dcc7;font-size:12px}
  .ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ctl button:not(.dxcal),.ctl input{font:inherit;font-size:13px;border:0;border-radius:20px;padding:5px 11px;cursor:pointer}
  .ctl input{background:var(--accent);color:#2c2620;font-weight:700}
  .ctl button{background:#3d3a34;color:#e5dcc7}
  .ctl button.on{background:#e5dcc7;color:#2c2620}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
  h2{font-size:15px;margin:0 0 10px}
  .muted{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .k{border:1px solid var(--line);border-radius:10px;padding:10px}
  .k .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .k .v{font-size:22px;font-weight:700;margin-top:4px}
  .k .c{font-size:12px;margin-top:2px}
  .up{color:var(--green)} .dn{color:var(--red)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;color:var(--muted);text-transform:uppercase}
  td.n,th.n{text-align:right;white-space:nowrap}
  td.t{max-width:520px;word-break:break-word}
  .none{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1 id="title">Daily view</h1><div class="sub" id="sub"></div></div>
  <div class="ctl">
    <button id="prev" title="Previous day">‹</button>
    <input type="hidden" id="d"><button class="dxcal" id="dc" title="Pick any day"></button>
    <button id="next" title="Next day">›</button>
    <button data-l="en" class="lb on">EN</button><button data-l="vi" class="lb">VI</button>
    <a href="index.html" id="latest">Latest report</a> · <a href="history.html">History</a>
  </div>
</div></header>
<div class="wrap" id="main"><p class="muted">Loading…</p></div>
<script>
/* dxCal: lịch bật ra cho ô ngày (Mon-first, mũi tên lên/xuống đổi tháng, Clear / Today).
   Dùng: <button class="dxcal" data-value="YYYY-MM-DD" data-min=".." data-max=".."></button>
   el.dxPick = function(dateStr){...}  (gọi khi chọn ngày) */
(function () {
  if (window.dxCal) return;
  var css = '.dxcal{background:#c9a46a;color:#2c2620;border:0;border-radius:20px;padding:4px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}' +
    '.dxcal:after{content:" \\25BE"}' +
    '.dxpop{position:absolute;z-index:9999;background:#fff;color:#222;border:1px solid #d9d9d9;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px;width:268px;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:left}' +
    '.dxpop .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}' +
    '.dxpop .hd b{font-size:14px;cursor:pointer}.dxpop .hd button{border:0;background:none;font-size:18px;cursor:pointer;padding:2px 8px;color:#444}' +
    '.dxpop table{width:100%;border-collapse:collapse}.dxpop th{font-weight:600;color:#555;padding:4px 0;text-align:center;font-size:12px}' +
    '.dxpop td{text-align:center;padding:1px}.dxpop td span{display:block;padding:6px 0;border-radius:4px;cursor:pointer;border:1px solid transparent}' +
    '.dxpop td span:hover{background:#eef3ff}.dxpop td.o span{color:#aaa}.dxpop td.x span{color:#ccc;cursor:not-allowed;background:none}' +
    '.dxpop td.t span{border-color:#555}.dxpop td.s span{background:#1a73e8;color:#fff}' +
    '.dxpop .ft{display:flex;justify-content:space-between;margin-top:8px}.dxpop .ft a{color:#1a73e8;cursor:pointer;text-decoration:none}' +
    '.dxpop select{font:inherit;margin-left:6px}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  var M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var show = function (v) { return v ? v.slice(8, 10) + '/' + v.slice(5, 7) + '/' + v.slice(0, 4) : 'Pick a date'; };
  var pop = null;
  function close() { if (pop) { pop.remove(); pop = null; } }
  document.addEventListener('mousedown', function (e) { if (pop && !pop.contains(e.target) && !e.target.classList.contains('dxcal')) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  function open(el) {
    close();
    var val = el.dataset.value, mn = el.dataset.min || '', mx = el.dataset.max || '';
    var cur = new Date((val || iso(new Date())) + 'T00:00:00'); cur.setDate(1);
    pop = document.createElement('div'); pop.className = 'dxpop';
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect();
    pop.style.top = (window.scrollY + r.bottom + 6) + 'px';
    pop.style.left = Math.max(8, Math.min(window.scrollX + r.right - 268, window.scrollX + document.documentElement.clientWidth - 284)) + 'px';
    function pick(v) { el.dataset.value = v; el.textContent = show(v); close(); if (el.dxPick) el.dxPick(v); }
    function draw() {
      var y = cur.getFullYear(), m = cur.getMonth(), today = iso(new Date());
      var start = new Date(y, m, 1), off = (start.getDay() + 6) % 7; start.setDate(1 - off);
      var yrs = '', y0 = mn ? +mn.slice(0, 4) : y - 5, y1 = mx ? +mx.slice(0, 4) : y + 1;
      for (var k = y1; k >= y0; k--) yrs += '<option' + (k === y ? ' selected' : '') + '>' + k + '</option>';
      var h = '<div class="hd"><b>' + M[m] + '<select>' + yrs + '</select></b><span><button data-n="-1" title="Previous month">&#8593;</button><button data-n="1" title="Next month">&#8595;</button></span></div><table><tr>' +
        ['M','T','W','T','F','S','S'].map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>';
      for (var w = 0; w < 6; w++) {
        h += '<tr>';
        for (var i = 0; i < 7; i++) {
          var d = new Date(start); d.setDate(start.getDate() + w * 7 + i);
          var v = iso(d), c = [];
          if (d.getMonth() !== m) c.push('o');
          if ((mn && v < mn) || (mx && v > mx)) c.push('x');
          if (v === today) c.push('t');
          if (v === el.dataset.value) c.push('s');
          h += '<td class="' + c.join(' ') + '"><span data-v="' + v + '">' + d.getDate() + '</span></td>';
        }
        h += '</tr>';
      }
      h += '</table><div class="ft"><a data-a="clear">Clear</a><a data-a="today">Today</a></div>';
      pop.innerHTML = h;
      pop.querySelector('select').onchange = function () { cur.setFullYear(+this.value); draw(); };
      pop.querySelectorAll('.hd button').forEach(function (b) { b.onclick = function () { cur.setMonth(cur.getMonth() + (+b.dataset.n)); draw(); }; });
      pop.querySelectorAll('td span').forEach(function (s) { s.onclick = function () { if (!s.parentNode.classList.contains('x')) pick(s.dataset.v); }; });
      pop.querySelector('[data-a=clear]').onclick = function () { el.dataset.value = ''; el.textContent = show(''); close(); };
      pop.querySelector('[data-a=today]').onclick = function () {
        var t = iso(new Date()); if (mx && t > mx) t = mx; if (mn && t < mn) t = mn; pick(t);
      };
    }
    draw();
  }
  window.dxCal = function (el) {
    el.textContent = show(el.dataset.value);
    el.onclick = function (e) { e.preventDefault(); pop ? close() : open(el); };
  };
  document.querySelectorAll('.dxcal').forEach(window.dxCal);
})();

</script>
<script>
let LANG = 'en';
const L = (vi, en) => LANG === 'vi' ? vi : en;
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = v => v == null ? '—' : (typeof v === 'number' ? v.toLocaleString('en-AU', {maximumFractionDigits: 2}) : E(v));
const get = u => fetch(u, {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
const shift = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
let S = {}, DAYS = {}, SNAP = new Set(), SITE = '', MIN = '', MAX = '';

function val(s, d) { const p = s.idx[d]; return p == null ? null : p; }
function avg7(s, d) { let t = 0, n = 0; for (let i = 1; i <= 7; i++) { const v = s.idx[shift(d, -i)]; if (v != null) { t += v; n++; } } return n ? t / n : null; }
function pc(a, b) { if (a == null || b == null || !b) return ''; const p = (a - b) / b * 100; return `<span class="${p >= 0 ? 'up' : 'dn'}">${p >= 0 ? '+' : ''}${p.toFixed(1)}%</span>`; }

let FIRST = {};
function table(rows, cols, src) {
  if (!rows || !rows.length) {
    const d = document.getElementById('d').value, f = src && FIRST[src];
    if (f && d < f) return `<p class="none">${L('Nguồn này chỉ có dữ liệu từ', 'This source only has data from')} ${f}.</p>`;
    return `<p class="none">${L('Không có dữ liệu cho ngày này.', 'No data for this day.')}</p>`;
  }
  return `<div class="scroll"><table><tr>${cols.map(c => `<th class="${c[2] || ''}">${c[0]}</th>`).join('')}</tr>` +
    rows.map(r => `<tr>${cols.map(c => `<td class="${c[2] || ''}">${c[3] ? c[3](r) : F(r[c[1]])}</td>`).join('')}</tr>`).join('') + '</table></div>';
}
const link = (u, t) => u ? `<a href="${E(u)}" target="_blank" rel="noopener">${E(t || u)}</a>` : E(t);

function render() {
  const d = document.getElementById('d').value;
  document.documentElement.lang = LANG;
  document.getElementById('title').textContent = SITE + ' — ' + L('Xem theo ngày · mọi kênh', 'Daily view · all channels');
  document.getElementById('sub').textContent = L('Số theo ngày lấy thẳng từ API của từng nguồn', 'Daily numbers straight from each source API') + ' · ' + d;
  const groups = {day: [], state: [], window28: []};
  Object.entries(S).forEach(([k, s]) => { if (groups[s.grain] && val(s, d) != null) groups[s.grain].push([k, s]); });
  const tiles = arr => arr.length ? '<div class="grid">' + arr.map(([k, s]) => {
    const v = val(s, d), p = s.idx[shift(d, -1)], a = avg7(s, d);
    return `<div class="k"><div class="l">${E(s.label)}</div><div class="v">${F(v)}</div>` +
      (s.grain === 'day' ? `<div class="c">${L('so với hôm trước', 'vs prev day')} ${pc(v, p) || '—'} · ${L('so với TB 7 ngày', 'vs 7-day avg')} ${pc(v, a) || '—'}</div>` : '') + '</div>';
  }).join('') + '</div>' : `<p class="none">${L('Không có số đo cho ngày này.', 'No readings for this day.')}</p>`;
  const x = Object.assign({}, DAYS[d] || {});
  const srt = (a, k1, k2) => a && a.slice().sort((p, q) => (q[k1] || 0) - (p[k1] || 0) || (q[k2] || 0) - (p[k2] || 0));
  if (x.queries) x.queries = srt(x.queries, 'clicks', 'impressions'); if (x.pages) x.pages = srt(x.pages, 'clicks', 'impressions');
  let h = '';
  if (SNAP.has(d)) h += `<section class="card">📄 ${L('Có báo cáo đầy đủ cho ngày này:', 'A full report exists for this day:')} <a href="archive/${d}.html">archive/${d}.html</a></section>`;
  h += `<section class="card"><h2>${L('Chỉ số trong ngày', 'Daily metrics')} <span class="muted">· ${d}</span></h2>${tiles(groups.day)}</section>`;
  if (groups.state.length || groups.window28.length)
    h += `<section class="card"><h2>${L('Số đọc trong ngày (tổng / 28 ngày)', 'Readings taken this day (totals / 28-day windows)')}</h2>${tiles(groups.state.concat(groups.window28))}</section>`;
  const qc = [['Query', 'q'], ['Clicks', 'clicks', 'n'], [L('Hiển thị', 'Impr.'), 'impressions', 'n'], ['CTR %', 'ctr_pct', 'n'], [L('Vị trí', 'Pos.'), 'position', 'n']];
  {
    h += `<section class="card"><h2>Google Search Console — ${L('top truy vấn', 'top queries')}</h2>${table(x.queries, qc, 'gsc')}</section>`;
    h += `<section class="card"><h2>Google Search Console — ${L('top trang', 'top pages')}</h2>${table(x.pages, [[L('Trang', 'Page'), 'page', 't', r => link(r.page, r.page.replace(/^https?:\/\/[^/]+/, '') || '/')]].concat(qc.slice(1)), 'gsc')}</section>`;
  }
  const gc = [['Sessions', 'sessions', 'n'], ['Engaged', 'engaged', 'n'], [L('Người dùng', 'Users'), 'users', 'n'], ['Key events', 'key_events', 'n']];
  {
    h += `<section class="card"><h2>GA4 — ${L('kênh', 'channels')}</h2>${table(x.channels, [[L('Kênh', 'Channel'), 'name']].concat(gc), 'ga4')}</section>`;
    h += `<section class="card"><h2>GA4 — ${L('trang đích', 'landing pages')}</h2>${table(x.landing, [[L('Trang', 'Page'), 'name', 't']].concat(gc), 'ga4')}</section>`;
  }
  const pcols = [[L('Giờ (UTC)', 'Time (UTC)'), 'time'], [L('Nội dung', 'Post'), 't', 't', r => link(r.url, r.t || L('(không có chữ)', '(no text)'))],
                 ['Reactions', 'react', 'n'], ['Comments', 'com', 'n']];
  h += `<section class="card"><h2>Facebook — ${L('bài đăng trong ngày', 'posts published this day')}</h2>${table(x.fb_posts, pcols.concat([['Shares', 'sh', 'n']]), 'fb')}</section>`;
  h += `<section class="card"><h2>Instagram — ${L('bài đăng trong ngày', 'posts published this day')}</h2>${table(x.ig_posts, pcols.slice(0, 1).concat([[L('Loại', 'Type'), 'type']], pcols.slice(1)), 'ig')}</section>`;
  h += `<p class="muted">${L('Dữ liệu có từ', 'Data available from')} ${MIN} ${L('đến', 'to')} ${MAX}. ${L('YouTube, LinkedIn, Ahrefs không có API theo ngày nên chỉ có số đọc từng ngày.', 'YouTube, LinkedIn and Ahrefs have no daily API, so only the readings taken each day appear.')}</p>`;
  document.getElementById('main').innerHTML = h;
  document.querySelectorAll('.lb').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  const dc = document.getElementById('dc'); dc.dataset.value = d; dc.textContent = d.slice(8) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4);
  history.replaceState(null, '', '?d=' + d);
}

const R1 = '../dxliving-seo-report/data/', R2 = '../dxl-social-dashboard-site/data/';   // một trang ngày cho mọi kênh
Promise.all([get(R1 + 'series.json'), get(R2 + 'series.json'), get(R1 + 'rollup.json'), get(R2 + 'rollup.json'),
             get(R1 + 'days.json'), get(R2 + 'days.json'), get('data/index.json'), get('data/rollup.json')]).then(([s1, s2, r1, r2, d1, d2, ix, own]) => {
  const se = {series: Object.assign({}, (s1 && s1.series) || {}, (s2 && s2.series) || {})};
  const ro = {site: own && own.site, series: Object.assign({}, (r1 && r1.series) || {}, (r2 && r2.series) || {})};
  const dy = {days: {}};
  [d1, d2].forEach(x => Object.entries((x && x.days) || {}).forEach(([d, v]) => Object.assign(dy.days[d] = dy.days[d] || {}, v)));
  const first = a => { const k = Object.keys(a).filter(Boolean); return k.length ? k.sort()[0] : ''; };
  const fp = k => ((se.series[k] || {}).points || [{}])[0].d || '';
  FIRST = {gsc: fp('gsc_clicks_day'), ga4: fp('ga4_sessions_day'), fb: fp('fb_views_day'), ig: fp('ig_reach_day_api')};
  const api = (se && se.series) || {}, nk = k => k.replace(/_api$/, '').replace(/_/g, ''), have = new Set(Object.keys(api).map(nk));
  const ros = {}; Object.entries((ro && ro.series) || {}).forEach(([k, s]) => { if (!(s.grain === 'day' && have.has(nk(k)))) ros[k] = s; });  // same metric from the API wins
  const all = Object.assign({}, ros, api);
  Object.entries(all).forEach(([k, s]) => { if (!s || !s.points) return; s.idx = {}; s.points.forEach(p => { if (p.v != null) s.idx[p.d] = p.v; }); S[k] = s; });
  DAYS = (dy && dy.days) || {};
  ((ix && ix.snapshots) || []).forEach(s => SNAP.add(s.date));
  SITE = 'DX Living';
  const dates = Object.values(S).filter(s => s.grain === 'day').flatMap(s => s.points.map(p => p.d)).concat(Object.keys(DAYS)).sort();
  MIN = dates[0] || ''; MAX = dates[dates.length - 1] || '';
  const inp = document.getElementById('d');
  inp.min = MIN; inp.max = MAX;
  const q = new URLSearchParams(location.search).get('d');
  inp.value = q && q >= MIN && q <= MAX ? q : MAX;
  const dc = document.getElementById('dc'); dc.dataset.min = MIN; dc.dataset.max = MAX; dc.dataset.value = inp.value; dxCal(dc);
  dc.dxPick = v => { inp.value = v; render(); };
  document.getElementById('prev').onclick = () => { if (inp.value > MIN) { inp.value = shift(inp.value, -1); render(); } };
  document.getElementById('next').onclick = () => { if (inp.value < MAX) { inp.value = shift(inp.value, 1); render(); } };
  document.querySelectorAll('.lb').forEach(b => b.onclick = () => { LANG = b.dataset.l; render(); });
  render();
});
</script>
</body>
</html>
